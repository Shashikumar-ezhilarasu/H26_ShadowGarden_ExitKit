name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Lint with ruff check
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Check format with ruff format --check
        run: uv run --python ${{ matrix.python-version }} ruff format --check .

      - name: Type check with mypy
        run: uv run --python ${{ matrix.python-version }} mypy exitkit

      - name: Run test suite with pytest
        run: uv run --python ${{ matrix.python-version }} pytest
